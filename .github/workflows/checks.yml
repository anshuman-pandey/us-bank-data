name: Release checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine
      - run: python -m pip install . packages/us-bank-data
      - run: python scripts/verify_public_entry.py
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m build packages/us-bank-data --outdir dist
      - run: python -m twine check dist/*
  notebooks-and-exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install '.[io,polars,notebooks]' packages/us-bank-data
      - run: python -m unittest discover -s tests -v
      - run: python -m ipykernel install --user --name banksonsale-launch
      - run: python scripts/verify_notebooks.py
  openbb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install . 'openbb>=5,<6'
      - run: python -m pip install integrations/openbb
      - run: python scripts/verify_openbb.py
