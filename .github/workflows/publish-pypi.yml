name: Publish verified release to PyPI
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tested release tag to publish
        required: true
        default: v0.1.0
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m build integrations/openbb --outdir dist
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
          skip-existing: true
