name: Publish verified release to PyPI
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tested release tag to publish
        required: true
        default: v0.1.1
      package:
        description: Package to publish (new projects require sequential pending publishers)
        required: true
        type: choice
        options: [all, core, openbb, us-bank-data]
        default: all
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - if: inputs.package == 'all' || inputs.package == 'us-bank-data'
        run: python -m pip install --no-deps packages/us-bank-data
      - if: inputs.package == 'all' || inputs.package == 'us-bank-data'
        run: python scripts/verify_public_entry.py
      - if: inputs.package == 'all' || inputs.package == 'core'
        run: python -m build
      - if: inputs.package == 'all' || inputs.package == 'openbb'
        run: python -m build integrations/openbb --outdir dist
      - if: inputs.package == 'all' || inputs.package == 'us-bank-data'
        run: python -m build packages/us-bank-data --outdir dist
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
          skip-existing: true
