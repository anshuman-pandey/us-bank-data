[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "banksonsale-data"
version = "0.1.0"
description = "BanksOnSale Data: source-linked U.S. bank financial panels for research, classes, and applications."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "DATA_LICENSE.md"]
authors = [{name = "BanksOnSale"}]
keywords = ["banksonsale", "bank-data", "fdic", "banking", "financial-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
parquet = ["pyarrow>=14"]
polars = ["polars>=0.20"]
io = ["pandas>=1.5", "pyarrow>=14"]
notebooks = ["pandas>=1.5", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]

[project.urls]
Homepage = "https://banksonsale.com"
Repository = "https://github.com/anshuman-pandey/banksonsale-data"
Documentation = "https://github.com/anshuman-pandey/banksonsale-data#readme"
Issues = "https://github.com/anshuman-pandey/banksonsale-data/issues"

[project.scripts]
banksonsale-data = "banksonsale_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
banksonsale_data = ["resources/*.json", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
